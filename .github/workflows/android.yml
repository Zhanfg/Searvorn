name: android-smoke

on:
  pull_request:
    paths:
      - "android/**"
      - "scripts/build-android-native.sh"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.6.0"

      - name: Ensure Android 17 SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -u+x | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT" >&2
            exit 2
          fi
          if [ ! -d "$SDK_ROOT/platforms/android-37" ]; then
            set +o pipefail
            yes | "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0" >/dev/null
            set -o pipefail
          fi

      - name: Assemble smoke APK
        run: gradle -p android :app:assembleDebug -PsearvornSkipNative=true --no-daemon --stacktrace
